<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AGUS Leak Detection</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100vh;height:100dvh;overflow:hidden;font-family:'DM Sans','Segoe UI',sans-serif;color:#1e293b;background:#fff}
/* ── Layout mirrors the AGUS main dashboard: padded row = left list card + rounded map card ── */
#dash{display:flex;flex-direction:row;gap:1rem;padding:1rem;height:100vh;height:100dvh;overflow:hidden;position:relative}
.panel{width:340px;min-width:320px;max-width:380px;height:100%;border-radius:14px;box-shadow:0 6px 24px rgba(0,64,128,.16);background:#fff;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.panel h3{margin:0;padding:1rem;font-size:1.35rem;color:#003366;background:#eef5fd;font-family:'Syne','DM Sans',sans-serif}
.pf{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid #e2e8f0}
.pf select,.pf button{flex:1;min-width:0;padding:6px 8px;border-radius:8px;border:1px solid #c7d2fe;background:#fff;font:600 12px 'DM Sans',sans-serif}
#list{list-style:none;margin:0;padding:0;overflow-y:auto;overflow-x:hidden;flex:1;display:flex;flex-direction:column}
#list li{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:52px;border-bottom:1px solid #f1f5f9;cursor:pointer;font-size:14px}
#list li:hover{background:#f1f7ff}#list li b{display:block}#list li small{color:#64748b;font-size:11px}
#list li .st{margin-left:auto;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;color:#fff}
.dot{width:12px;height:12px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:inline-block;flex-shrink:0}
.act{background:#2563eb}.sus{background:#9333ea}.rep{background:#10b981}
#mapbox{position:relative;flex:3;height:100%;border-radius:14px;overflow:hidden;box-shadow:0 6px 24px rgba(0,64,128,.16);min-width:0}
#map{position:absolute;inset:0}
#top{position:absolute;top:12px;left:14px;max-width:70%;display:flex;flex-wrap:wrap;gap:10px;z-index:1000}
.tc{background:rgba(255,255,255,.97);border:1px solid rgba(0,64,128,.1);box-shadow:0 4px 18px rgba(0,40,100,.13);border-radius:12px;padding:6px 12px;min-width:74px;display:flex;flex-direction:column;align-items:center;cursor:pointer;font-size:10px;font-weight:600;color:#475569;text-align:center;border-width:2px}
.tc b{font-size:20px;line-height:1.1}.tc.off{opacity:.45}
.tc.add{background:linear-gradient(90deg,#2563eb,#7c3aed);color:#fff;justify-content:center;font-size:12px;font-weight:700;border:0}
.dbar{background:rgba(255,255,255,.97);border:1px solid rgba(0,64,128,.1);box-shadow:0 4px 18px rgba(0,40,100,.13);border-radius:12px;padding:6px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;width:100%}
.dbar button,.dbar input,.dbar select{font:600 12px 'DM Sans',sans-serif;border:1px solid #c7d2fe;border-radius:8px;background:#fff;padding:5px 8px;color:#1e293b}
.dbar .nav{cursor:pointer;padding:5px 10px;font-size:14px;line-height:1}
.seg{display:inline-flex;border:1px solid #c7d2fe;border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:5px 9px;cursor:pointer}.seg button.on{background:#2563eb;color:#fff}
#dlabel{font-weight:700;color:#003366;margin-left:4px}#dsum{color:#64748b;font-weight:600}
#legend{position:absolute;bottom:14px;right:14px;z-index:1000;background:rgba(255,255,255,.97);border-radius:10px;box-shadow:0 4px 16px rgba(0,40,100,.14);padding:8px 12px;font-size:12px}
#legend label{display:flex;gap:6px;align-items:center;margin:3px 0;cursor:pointer;white-space:nowrap}#legend hr{border:0;border-top:1px solid #e2e8f0;margin:6px 0}
#card{position:absolute;right:14px;top:12px;width:340px;max-width:calc(100% - 28px);max-height:calc(100% - 100px);overflow:auto;background:#fff;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.3);padding:14px;z-index:1100;display:none;font-size:12px}
#card h3{margin:0 0 6px;font-size:15px}.x{float:right;cursor:pointer;border:0;background:none;font-size:18px}
.tl{display:flex;justify-content:space-between;margin:12px 0;text-align:center;font-size:10px;color:#64748b}.tl div{flex:1}
.tl i{display:block;width:12px;height:12px;border-radius:50%;margin:0 auto 3px;background:#cbd5e1}.tl i.on{background:#10b981}
.g{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#f1f5f9;border-radius:10px;padding:8px;margin-bottom:8px}.g small{color:#64748b;display:block}
#card textarea{width:100%;border:1px solid #e2e8f0;border-radius:8px;padding:6px;font:inherit}
#msg{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;background:#1e293b;color:#fff;border-radius:8px;padding:6px 12px;font-size:12px;z-index:1200;display:none}
#src{position:absolute;left:14px;bottom:14px;z-index:1000;background:rgba(255,255,255,.9);border-radius:8px;padding:3px 8px;font-size:10px;color:#64748b}
/* ── same tiers as main: 901–1400 ── */
@media screen and (min-width:901px) and (max-width:1400px){#dash{padding:.8rem;gap:.8rem}.panel{min-width:260px;max-width:300px;width:auto}.panel h3{font-size:1.1rem}#list li{font-size:12.5px}}
/* ≥1401 */
@media screen and (min-width:1401px){#dash{padding:1.2rem;gap:1.2rem}.tc{min-width:80px}}
/* ≤900: map fills the screen, list becomes the bottom strip (as on main) */
@media screen and (max-width:900px){
  :root{--ph:200px}
  #dash{padding:0;gap:0;display:block}
  #mapbox{position:fixed;top:0;left:0;right:0;bottom:var(--ph);height:auto;border-radius:0;box-shadow:none}
  .panel{position:fixed;bottom:0;left:0;right:0;width:100%;max-width:100%;min-width:0;height:var(--ph);z-index:2800;border-radius:14px 14px 0 0;box-shadow:0 -4px 20px rgba(0,64,128,.2)}
  .panel h3{font-size:.95rem;padding:.5rem 1rem}
  #list{flex-direction:row;overflow-x:auto;overflow-y:hidden}
  #list li{width:170px;min-width:170px;border-right:1px solid #f1f5f9;border-bottom:0;font-size:12px}
  #top{top:10px;left:8px;max-width:calc(100% - 16px);gap:6px}
  #legend{bottom:10px;right:8px;padding:5px 8px;font-size:10px}
  #card{left:8px;right:8px;top:auto;bottom:10px;width:auto;max-height:60%}
  #src{bottom:10px}
}
@media screen and (min-width:481px) and (max-width:900px){:root{--ph:210px}}
@media screen and (max-width:480px){:root{--ph:195px}.tc{min-width:48px;padding:4px 8px}.tc b{font-size:15px}}
@media (hover:none) and (pointer:coarse){#list li{min-height:44px}.tc,.pf select,.pf button{min-height:44px}}
@supports (padding:max(0px)){#top{left:max(8px,env(safe-area-inset-left))}}
</style></head><body>
<div id="dash">
  <aside class="panel">
    <h3>💧 Leak Locations</h3>
    <div class="pf"><select id="fType"><option value="">All types</option><option>Main</option><option>Service</option><option>Valve</option><option>Hydrant</option></select>
      <select id="fSub"><option value="">All sub types</option><option>Pipe</option><option>Joint</option><option>Fitting</option></select><button id="reset">Reset</button></div>
    <ul id="list"></ul>
  </aside>
  <div id="mapbox">
    <div id="map"></div>
    <div id="top">
      <div class="tc" data-s="Active"><b id="n-Active" style="color:#2563eb">0</b>Active Leaks</div>
      <div class="tc" data-s="Repaired"><b id="n-Repaired" style="color:#10b981">0</b>Repaired Leaks</div>
      <div class="tc" data-s="Suspected"><b id="n-Suspected" style="color:#9333ea">0</b>Suspected Locations</div>
      <div class="tc add" id="add">＋ Add Leak</div>
      <div class="tc exp" id="xcsv" title="Download the leaks currently shown (with GIS coordinates) as CSV"><b style="font-size:15px">⬇</b>CSV</div>
      <div class="tc exp" id="xpng" title="Download the current map view with location tags as a PNG image"><b style="font-size:15px">🗺</b>Map PNG</div>
      <div class="dbar" id="dbar">
        <button class="nav" id="dprev" title="Previous period">‹</button>
        <div class="seg" id="dseg"><button data-p="day">Day</button><button data-p="week">Week</button><button data-p="month">Month</button><button data-p="year">Year</button><button data-p="all" class="on">All</button></div>
        <button class="nav" id="dnext" title="Next period">›</button>
        <input type="date" id="dpick" title="Pick a date inside the period you want to view">
        <select id="dbasis" title="Which date to filter by"><option value="rep">By leak / POI date</option><option value="fix">By repaired date</option></select>
        <span id="dlabel">All dates</span><span id="dsum"></span>
      </div>
    </div>
    <div id="legend">
      <label><input type="radio" name="bm" value="sat" checked> Satellite</label>
      <label><input type="radio" name="bm" value="street"> Street</label><hr>
      <label><input type="checkbox" class="lay" value="Active" checked><i class="dot act"></i> Leaks</label>
      <label><input type="checkbox" class="lay" value="Suspected" checked><i class="dot sus"></i> Suspected</label>
      <label><input type="checkbox" class="lay" value="Repaired" checked><i class="dot rep"></i> Repaired</label>
    </div>
    <div id="src"></div><div id="card"></div><div id="msg"></div>
  </div>
</div>
<script>
/* Google Apps Script Web App URL (see Code.gs). Empty = demo data kept in this browser. */
var GAS_URL = 'https://script.google.com/macros/s/AKfycbyIw6X-s-uijCL09vle3Tf-Tp0r14LRpJkB-_2M5ePW-zGHRap0DQzHRFjOHUDhylV0Mw/exec';
var CENTER=[10.1129,123.6740], COLORS={Active:'#2563eb',Suspected:'#9333ea',Repaired:'#10b981'};
var leaks=[], shown={Active:1,Suspected:1,Repaired:1}, adding=false, markers={};
var sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,crossOrigin:true});
var st=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,crossOrigin:true});
var map=L.map('map',{layers:[sat]}).setView(CENTER,13);
function $(i){return document.getElementById(i)}
function toast(t){var m=$('msg');m.textContent=t;m.style.display='block';setTimeout(function(){m.style.display='none'},2200)}
function today(){return new Date().toISOString().slice(0,10)}
function demo(){return [
 {id:'L-1001',lat:10.1129,lng:123.6740,status:'Active',type:'Main',sub:'Pipe',pipe:'Polyethylene / PVC',address:'Poblacion District',poi:'2026-05-25',leak:'2026-06-23',repaired:'',comments:''},
 {id:'L-1002',lat:10.1180,lng:123.6805,status:'Suspected',type:'Service',sub:'Joint',pipe:'PVC',address:'Sitio Riverside',poi:'2026-07-02',leak:'',repaired:'',comments:''},
 {id:'L-1003',lat:10.1075,lng:123.6685,status:'Repaired',type:'Main',sub:'Pipe',pipe:'Polyethylene / PVC',address:'Poblacion District',poi:'2025-09-25',leak:'2026-06-23',repaired:'2026-07-06',comments:'ML-NS-CON'}]}
function load(){
  if(!GAS_URL){var s=localStorage.getItem('agus_leaks');leaks=s?JSON.parse(s):demo();$('src').textContent='Demo data';draw();return}
  fetch(GAS_URL+'?action=list').then(function(r){return r.json()}).then(function(d){leaks=d.leaks||[];$('src').textContent='Live · Google Sheet';draw()})
   .catch(function(){leaks=demo();$('src').textContent='Offline demo data';draw()})}
function save(l){
  if(!GAS_URL){localStorage.setItem('agus_leaks',JSON.stringify(leaks));return}
  fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'save',leak:l})}).then(function(){toast('Saved')}).catch(function(){toast('Save failed')})}
function icon(s){return L.divIcon({className:'',iconSize:[22,22],iconAnchor:[11,22],html:'<div style="width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:'+COLORS[s]+';border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5)"></div>'})}
/* ── date selection: Day / Week (Mon–Sun) / Month / Year / All ── */
var per='all', anchor=new Date(); anchor.setHours(0,0,0,0);
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function pad(n){return ('0'+n).slice(-2)}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function dnorm(x){ if(!x)return ''; x=String(x); if(/^\d{4}-\d{2}-\d{2}$/.test(x))return x; var d=new Date(x); return isNaN(d)?x.slice(0,10):ymd(d)}
function range(){
  if(per==='all')return null;
  var y=anchor.getFullYear(),m=anchor.getMonth(),d=anchor.getDate(),a,b;
  if(per==='day'){a=b=new Date(y,m,d)}
  else if(per==='week'){var dow=(anchor.getDay()+6)%7;a=new Date(y,m,d-dow);b=new Date(y,m,d-dow+6)}
  else if(per==='month'){a=new Date(y,m,1);b=new Date(y,m+1,0)}
  else{a=new Date(y,0,1);b=new Date(y,11,31)}
  return [ymd(a),ymd(b),a,b]}
function dateOf(l){return $('dbasis').value==='fix'?dnorm(l.repaired):dnorm(l.leak||l.poi)}
function inPeriod(l){var r=range();if(!r)return true;var d=dateOf(l);return !!d&&d>=r[0]&&d<=r[1]}
function typeOK(l){return(!$('fType').value||l.type===$('fType').value)&&(!$('fSub').value||l.sub===$('fSub').value)}
function short(d){return MONTHS[d.getMonth()].slice(0,3)+' '+d.getDate()}
function plabel(){
  var r=range();if(!r)return 'All dates';
  if(per==='day')return short(r[2])+', '+r[2].getFullYear();
  if(per==='week')return short(r[2])+' – '+short(r[3])+', '+r[3].getFullYear();
  if(per==='month')return MONTHS[anchor.getMonth()]+' '+anchor.getFullYear();
  return String(anchor.getFullYear())}
function shift(k){
  var y=anchor.getFullYear(),m=anchor.getMonth(),d=anchor.getDate();
  if(per==='day')anchor=new Date(y,m,d+k);else if(per==='week')anchor=new Date(y,m,d+7*k);
  else if(per==='month')anchor=new Date(y,m+k,1);else if(per==='year')anchor=new Date(y+k,m,1);
  draw()}
function visible(l){return shown[l.status]&&typeOK(l)&&inPeriod(l)}
function draw(){
  Object.keys(markers).forEach(function(k){map.removeLayer(markers[k])});markers={};
  var base=leaks.filter(function(l){return typeOK(l)&&inPeriod(l)});
  ['Active','Repaired','Suspected'].forEach(function(s){$('n-'+s).textContent=base.filter(function(l){return l.status===s}).length});
  $('dlabel').textContent=plabel();$('dsum').textContent='· '+base.length+' leak'+(base.length===1?'':'s');
  $('dpick').value=ymd(anchor);
  Array.prototype.forEach.call($('dseg').children,function(b){b.classList.toggle('on',b.dataset.p===per)});
  $('dprev').disabled=$('dnext').disabled=(per==='all');
  var vis=leaks.filter(visible), ul=$('list'); ul.innerHTML='';
  vis.forEach(function(l){
    markers[l.id]=L.marker([l.lat,l.lng],{icon:icon(l.status)}).addTo(map).on('click',function(){show(l)});
    var li=document.createElement('li');
    li.innerHTML='<i class="dot '+({Active:'act',Suspected:'sus',Repaired:'rep'}[l.status])+'"></i><div><b>'+l.id+'</b><small>'+(l.address||l.type||'')+'</small></div><span class="st" style="background:'+COLORS[l.status]+'">'+l.status+'</span>';
    li.onclick=function(){map.flyTo([l.lat,l.lng],18,{duration:.7});show(l)};ul.appendChild(li)});
  if(!vis.length)ul.innerHTML='<li style="color:#94a3b8;justify-content:center">No leaks to show</li>'}
function show(l){
  var c=$('card'),rep=l.status==='Repaired';c.style.display='block';
  c.innerHTML='<button class="x" onclick="this.parentNode.style.display=\'none\'">✕</button><h3>'+l.status+' · '+l.id+'</h3>'
   +'<div><b>Address:</b> '+(l.address||'—')+'<br><b>Pipe Type:</b> '+(l.pipe||'—')+'<br><b>Coords:</b> '+l.lat.toFixed(5)+', '+l.lng.toFixed(5)+'</div>'
   +'<div class="tl"><div><i class="on"></i>POI<br>'+(l.poi||'')+'</div><div><i class="'+(l.leak?'on':'')+'"></i>Leak<br>'+(l.leak||'')+'</div><div><i class="'+(rep?'on':'')+'"></i>Repaired<br>'+(l.repaired||'')+'</div></div>'
   +'<div class="g"><div><small>Leak Type</small><b>'+(l.type||'—')+'</b></div><div><small>Sub Type</small><b>'+(l.sub||'—')+'</b></div></div>'
   +'<small>Comments</small><textarea id="cm" rows="3">'+(l.comments||'')+'</textarea>'
   +'<label style="display:block;margin-top:8px"><input type="checkbox" id="mr" '+(rep?'checked':'')+'> Mark as Repaired</label>'
   +'<button style="margin-top:8px;padding:7px 14px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer" id="sv">Save</button>';
  $('sv').onclick=function(){l.comments=$('cm').value;
    if($('mr').checked&&l.status!=='Repaired'){l.status='Repaired';l.repaired=today()}else if(!$('mr').checked&&l.status==='Repaired'){l.status='Active';l.repaired=''}
    save(l);draw();show(l)}}
map.on('click',function(e){
  if(!adding)return;adding=false;$('add').textContent='＋ Add Leak';
  var l={id:'L-'+Date.now().toString().slice(-6),lat:e.latlng.lat,lng:e.latlng.lng,status:'Suspected',type:'Main',sub:'Pipe',pipe:'',address:'',poi:today(),leak:'',repaired:'',comments:''};
  leaks.push(l);save(l);draw();show(l)});
$('add').onclick=function(){adding=!adding;this.textContent=adding?'Click the map…':'＋ Add Leak'};
function sync(s){$('top').querySelector('.tc[data-s='+s+']').classList.toggle('off',!shown[s]);document.querySelector('.lay[value='+s+']').checked=!!shown[s]}
document.querySelectorAll('.tc[data-s]').forEach(function(k){k.onclick=function(){var s=k.dataset.s;shown[s]=shown[s]?0:1;sync(s);draw()}});
document.querySelectorAll('.lay').forEach(function(c){c.onchange=function(){shown[c.value]=c.checked?1:0;sync(c.value);draw()}});
document.querySelectorAll('[name=bm]').forEach(function(r){r.onchange=function(){map.removeLayer(sat);map.removeLayer(st);(r.value==='sat'?sat:st).addTo(map)}});
$('fType').onchange=$('fSub').onchange=$('dbasis').onchange=draw;
Array.prototype.forEach.call($('dseg').children,function(b){b.onclick=function(){per=b.dataset.p;draw()}});
$('dprev').onclick=function(){shift(-1)};$('dnext').onclick=function(){shift(1)};
$('dpick').onchange=function(){if(this.value){var p=this.value.split('-');anchor=new Date(+p[0],+p[1]-1,+p[2]);if(per==='all')per='day';draw()}};
$('reset').onclick=function(){$('fType').value=$('fSub').value='';per='all';anchor=new Date();anchor.setHours(0,0,0,0);$('dbasis').value='rep';shown={Active:1,Suspected:1,Repaired:1};['Active','Suspected','Repaired'].forEach(sync);draw()};

/* ── Downloads: CSV (GIS coordinates + map link) and map PNG with location tags ── */
function dl(blob,name){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},800)}
function fname(ext){return 'AGUS_Leaks_'+plabel().replace(/[^\w]+/g,'_').replace(/^_|_$/g,'')+'.'+ext}
function csvCell(v){v=(v===undefined||v===null)?'':String(v);return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function exportCSV(){
  var rows=leaks.filter(visible);
  if(!rows.length){toast('No leaks in this view to export');return}
  var head=['Leak ID','Latitude','Longitude','Status','Leak Type','Sub Type','Pipe Type','Address','POI Date','Leak Date','Repaired Date','Comments','Map Link'];
  var out=[head.join(',')].concat(rows.map(function(l){
    return [l.id,l.lat,l.lng,l.status,l.type,l.sub,l.pipe,l.address,dnorm(l.poi),dnorm(l.leak),dnorm(l.repaired),l.comments,'https://www.google.com/maps?q='+l.lat+','+l.lng].map(csvCell).join(',')}));
  dl(new Blob(['\ufeff'+out.join('\r\n')],{type:'text/csv;charset=utf-8'}),fname('csv'));
  toast('CSV downloaded · '+rows.length+' leak'+(rows.length===1?'':'s'))}
function rrect(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function pngCanvas(withTiles){
  var box=$('map'),mr=box.getBoundingClientRect(),S=2,W=Math.round(mr.width),H=Math.round(mr.height),HD=62;
  var c=document.createElement('canvas');c.width=W*S;c.height=(H+HD)*S;
  var x=c.getContext('2d');x.scale(S,S);
  /* header */
  var g=x.createLinearGradient(0,0,W,0);g.addColorStop(0,'#0b3d91');g.addColorStop(1,'#6d28d9');x.fillStyle=g;x.fillRect(0,0,W,HD);
  x.fillStyle='#fff';x.textBaseline='alphabetic';
  x.font='700 17px "DM Sans",Arial,sans-serif';x.fillText('AGUS Leak Detection — Carcar Water District',14,25);
